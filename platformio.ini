; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = tinypico, lolin32
extra_configs =
  platformio_override.ini

[env]
framework = arduino
; upload_port = /dev/cu.SLAB_USBtoUART
; monitor_port = /dev/cu.SLAB_USBtoUART
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -Ofast

[env:tinypico]
board = tinypico
platform = espressif32@3.4.0
lib_deps = tinypico/TinyPICO Helper Library@^1.4.0
build_flags = -Ofast -D USE_I2S_MIC_INPUT -D USE_ESP_NOW

[env:lolin32]
board = lolin32
platform = espressif32@3.4.0
build_flags = -Ofast -D USE_I2S_MIC_INPUT -D USE_ESP_NOW
lib_ignore = indicator_led_pico

; ESP32-S3 target (INMP441 I2S mic + MAX98357 I2S amp), N16R8 module
; (16MB flash + 8MB octal PSRAM). Needs espressif32 >= 5.x / Arduino core
; >= 2.0.x for S3 support; the classic ESP32 envs above stay on 3.4.0.
[env:esp32s3]
board = esp32-s3-devkitc-1
platform = espressif32@6.12.0
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = default_16MB.csv
; N16R8 = quad-SPI flash + octal-SPI PSRAM
board_build.arduino.memory_type = qio_opi
build_flags =
  -Ofast
  -D USE_I2S_MIC_INPUT
  -D USE_ESP_NOW
  -D USE_OPUS_CODEC
  -D BOARD_HAS_PSRAM
lib_deps =
  sh123/esp32_opus@^1.0.3
lib_ignore = indicator_led_pico
